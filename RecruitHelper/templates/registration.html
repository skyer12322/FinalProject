<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include "menu.html" %}

    <div class="container mt-5">
        <h2 class="text-center">Регистрация</h2>
        <form>
            <div class="form-group">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="companyCheckbox">
                    <label class="form-check-label" for="companyCheckbox">
                        Регистрация компании
                    </label>
                </div>
            </div>

            <div id="userFields">
                <div class="form-group">
                    <label for="firstName">Имя</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label for="secondName">Фамилия</label>
                    <input type="text" class="form-control" id="secondName" placeholder="Введите фамилию">
                </div>
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" class="form-control" id="username" placeholder="Введите имя пользователя">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Введите e-mail">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="Введите пароль">
                </div>
            </div>

            <div id="companyFields" style="display: none;">
                <div class="form-group">
                    <label for="companyName">Название компании</label>
                    <input type="text" class="form-control" id="companyName" placeholder="Введите название компании">
                </div>
                <div class="form-group">
                    <label for="contactEmail">Контактный e-mail</label>
                    <input type="email" class="form-control" id="contactEmail" placeholder="Введите контактный e-mail">
                </div>
                <div class="form-group">
                    <label for="contactPhone">Контактный номер телефона</label>
                    <input type="text" class="form-control" id="contactPhone" placeholder="Введите контактный номер телефона">
                </div>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="termsCheckbox">
                <label class="form-check-label" for="termsCheckbox">
                    Я согласен с <a href="/terms">Условиями обслуживания</a>
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="newsletterCheckbox">
                <label class="form-check-label" for="newsletterCheckbox">
                    Подписаться на рассылку
                </label>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Зарегистрироваться</button>
        </form>
    </div>

    <script>
        document.getElementById('companyCheckbox').addEventListener('change', function() {
            const userFields = document.getElementById('userFields');
            const companyFields = document.getElementById('companyFields');
            if (this.checked) {
                userFields.style.display = 'none';
                companyFields.style.display = 'block';
            } else {
                userFields.style.display = 'block';
                companyFields.style.display = 'none';
            }
        });
    </script>

    {% include "footer.html" %}
</body>
</html>
