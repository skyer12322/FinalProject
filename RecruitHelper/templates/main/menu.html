{% load static %}

<header class="header">
    <div class="header-container">
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'images/logo.jpg' %}" alt="Logo" class="logo-img">
            <span>CareerAI</span>
        </a>
        
        <nav>
            <ul class="nav-menu">
                <li><a href="{% url 'home' %}">Главная</a></li>
                <li><a href="{% url 'vacancies_list' %}">Вакансии</a></li>
                <li><a href="{% url 'news' %}">Новости</a></li>
                <li><a href="{% url 'about_us' %}">О нас</a></li>
            </ul>
        </nav>
        
        <div class="header-actions">
            {% if user.is_authenticated %}
                {% if user.role == 'company' %}
                    <a href="{% url 'add_vacancy' %}" class="btn btn-primary">Разместить вакансию</a>
                {% endif %}
                <a href="{% url 'profile' %}">
                    {% if user.profile_image %}
                        <img src="{{ user.profile_image.url }}" alt="Avatar" class="user-avatar">
                    {% else %}
                        <img src="{% static 'images/default_avatar.png' %}" alt="Avatar" class="user-avatar">
                    {% endif %}
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline">Войти</a>
                <a href="{% url 'register' %}" class="btn btn-primary">Регистрация</a>
            {% endif %}
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div>
    </div>
</header>

<script>
document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
    const nav = document.querySelector('.nav-menu');
    nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
    if (window.innerWidth <= 768) {
        nav.style.position = 'absolute';
        nav.style.top = '64px';
        nav.style.left = '0';
        nav.style.right = '0';
        nav.style.background = 'white';
        nav.style.flexDirection = 'column';
        nav.style.padding = '20px';
        nav.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
    }
});
</script>
