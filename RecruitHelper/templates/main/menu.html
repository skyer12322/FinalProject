{% load static %}

<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<link rel="stylesheet" href="{% static 'css/main/menu.css' %}">
<link rel="stylesheet" href="{% static 'css/mobile.css' %}">

<nav class="navbar">
    <div class="nav-container">
        <div class="logo-wrapper">
            <img src="{% static 'images/logo.jpg' %}" alt="Лого компании" class="logo" style="width: 50px; height: 50px; border-radius: 10%;">
        </div>
        
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <ul class="centered-menu" id="mobileMenu">
            <li><a href="{% url 'home' %}">Главная</a></li>
            {% if request.path != '/login/' %}
                <li><a href="{% url 'vacancies_list' %}">Список вакансий</a></li>
            {% endif %}
            <li><a href="{% url 'news' %}">Новости</a></li>
        </ul>

        <div class="auth-wrapper">
            {% if request.path != '/login/' %}
                {% if user.is_authenticated %}
                    <div class="avatar-wrapper">
                        <a href="{% url 'profile' %}">
                            <img src="{% if user.avatar %}{{ user.avatar.url }}{% else %}{% static 'images/default_avatar.png' %}{% endif %}"
                                alt="Аватар"
                                class="user-avatar">
                        </a>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="login-button">Войти</a>
                {% endif %}
            {% endif %}
        </div>
    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('mobileMenuToggle');
    const menu = document.getElementById('mobileMenu');
    if (toggle && menu) {
        toggle.addEventListener('click', function() {
            menu.classList.toggle('active');
            toggle.classList.toggle('active');
        });
        menu.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                menu.classList.remove('active');
                toggle.classList.remove('active');
            }
        });
    }
});
</script>
