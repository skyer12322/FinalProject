<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор профиля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <script src="https://cdn.tiny.cloud/1/yld756yf9ed1e14fm4h6r81y9rtyw22ngfozr4p09t8rdywg/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>    
    <style>
        .editor-section {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .section-title {
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <form id="profileForm">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="editor-section">
                        <h3 class="section-title">Основные данные</h3>
                        
                        <div class="mb-3">
                            <label class="form-label">Аватар</label>
                            <div class="avatar-upload">
                                <input type="file" class="form-control" accept="image/*">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Контактные данные</label>
                            <input type="text" 
                                   class="form-control" 
                                   value="8 800 555 32 32"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">География</label>
                            <input type="text" 
                                   class="form-control" 
                                   value="Москва, Россия"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="editor-section">
                        <h3 class="section-title">Профиль</h3>
                        
                        <div class="mb-4">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" 
                                   class="form-control fs-4 fw-bold" 
                                   value="Каббар (Нау. гханка)"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Вакансия</label>
                            <input type="text" 
                                   class="form-control text-primary" 
                                   value="покорбателя"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Резюме</label>
                            <textarea id="resumeEditor" class="form-control">
                                Lorem ipsum dolor sit amet consectetur adipisicing elit...
                            </textarea>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="editor-section">
                        <h3 class="section-title">Дополнительно</h3>
                        
                        <div class="mb-3">
                            <label class="form-label">Компания</label>
                            <input type="text" 
                                   class="form-control" 
                                   value="Боже"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Специализация</label>
                            <textarea id="specializationEditor" class="form-control">
                                Боже для кардина/имена...
                            </textarea>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Сохранить изменения
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        tinymce.init({
            selector: '#resumeEditor, #specializationEditor',
            plugins: 'autoresize',
            toolbar: false,
            menubar: false,
            statusbar: false,
            content_style: 'body { font-family: Arial, sans-serif; font-size: 14px; }',
            autoresize_bottom_margin: 20,
            setup: (editor) => {
                editor.on('init', () => {
                    editor.getContainer().style.border = '1px solid #dee2e6';
                    editor.getContainer().style.borderRadius = '6px';
                });
            }
        });

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            console.log(Object.fromEntries(formData));
            alert('Изменения успешно сохранены!');
        });
    </script>
</body>
</html>
