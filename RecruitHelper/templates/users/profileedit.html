{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование профиля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tiny.cloud/1/your-api-key/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        .form-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .form-section h3 {
            color: #2d3748;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: 500;
            color: #4a5568;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <form id="profileForm" class="bg-white rounded-3 shadow p-4">
                    <div class="row g-4">
                        <!-- Левая колонка -->
                        <div class="col-md-6">
                            <div class="form-section">
                                <h3><i class="fas fa-user-circle me-2"></i>Основные данные</h3>
                                
                                <!-- Добавленные поля Имя и Фамилия -->
                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label">Имя</label>
                                        <input type="text" class="form-control" value="Каббар" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Фамилия</label>
                                        <input type="text" class="form-control" value="Гханка" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Аватар</label>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="avatar-preview rounded-circle overflow-hidden" style="width: 80px; height: 80px;">
                                            <img src="{% static 'images/default_avatar.png' %}" class="w-100 h-100 object-fit-cover">
                                        </div>
                                        <input type="file" class="form-control" accept="image/*">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Телефон</label>
                                    <input type="tel" class="form-control" value="8 800 555 32 32" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Местоположение</label>
                                    <input type="text" class="form-control" value="Москва, Россия" required>
                                </div>
                            </div>
                        </div>

                        <!-- Правая колонка -->
                        <div class="col-md-6">
                            <div class="form-section">
                                <h3><i class="fas fa-file-alt me-2"></i>Профиль</h3>
                                
                                <div class="mb-4">
                                    <label class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" value="Каббар (Нау. гханка)" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Позиция</label>
                                    <input type="text" class="form-control" value="покорбателя" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Резюме</label>
                                    <textarea id="resumeEditor" class="form-control"></textarea>
                                </div>
                            </div>

                            <div class="form-section">
                                <h3><i class="fas fa-cog me-2"></i>Дополнительно</h3>
                                
                                <div class="mb-4">
                                    <label class="form-label">Компания</label>
                                    <input type="text" class="form-control" value="Боже" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Специализация</label>
                                    <textarea id="specializationEditor" class="form-control"></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2">
                                    <i class="fas fa-save me-2"></i>Сохранить изменения
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        tinymce.init({
            selector: '#resumeEditor, #specializationEditor',
            plugins: 'autoresize lists link',
            toolbar: 'bold italic | bullist numlist | link',
            menubar: false,
            statusbar: false,
            skin: 'oxide',
            content_css: 'default',
            content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.6; }',
            autoresize_bottom_margin: 20
        });
    </script>
</body>
</html>
