{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="index-body">
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Вернуться на главную страницу</a>
        </div>
    </nav>

    <div class="vacancies-list-container" style="max-width: 500px; margin: 50px auto;">
        <h1 class="vacancies-list-h1 text-center">Авторизация</h1>

        <form method="post" class="login-form">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert alert-danger">
                    Неверное имя пользователя или пароль
                </div>
            {% endif %}

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="corporateAccount" name="corporateAccount">
                    <label class="form-check-label" for="corporateAccount">Корпоративный аккаунт</label>
                </div>
            </div>

            <div class="mb-3">
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Логин или email"
                       required>
            </div>

            <div class="mb-4">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Пароль"
                       required>
            </div>

            <button type="submit"
                    class="btn"
                    style="background-color: #00c4a0; color: white; padding: 12px; font-size: 1.1rem; width: 100%;">
                Войти
            </button>

            <div class="text-center mt-3">
                <a href="/register" class="text-muted">Зарегистрироваться</a> |
                <a href="/reset" class="text-muted">Восстановить пароль</a>
            </div>
        </form>
    </div>
    {% include "../main/footer.html" %}
</body>
</html>
