{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CareerAI</title>
    <link rel="stylesheet" href="{% static 'css/design.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <style>
        .auth-page {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--white);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--shadow-hover);
            max-width: 450px;
            width: 100%;
        }
        .auth-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }
        .auth-card p {
            text-align: center;
            color: var(--light-text);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-text);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--primary-blue);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .checkbox-group input {
            width: auto;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--light-text);
        }
        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% include "../main/menu.html" %}
    
    <main>
        <div class="auth-page">
            <div class="auth-card">
                <h1>Вход в систему</h1>
                <p>Войдите, чтобы продолжить работу</p>
                
                {% if messages %}
                <div class="error-message">{{ messages }}</div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="email" id="username" name="username" required placeholder="example@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" required placeholder="Введите пароль">
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="CompanyLoginCheckbox" name="CompanyLoginCheckbox">
                        <label for="CompanyLoginCheckbox" style="margin: 0; font-weight: 400;">Я представитель компании</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Войти</button>
                </form>
                
                <div class="auth-footer">
                    Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </main>
    
    {% include "../main/footer.html" %}
</body>
</html>
