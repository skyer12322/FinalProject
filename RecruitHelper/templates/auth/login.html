{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="{% static 'css/auth/login.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="index-body">
    {% include '../main/menu.html' %}

    <div class="row auth-container container mt-5 w-50 justify-content-center" style="max-width: auto; margin: 50px auto;">
        <div class="col-md-7">
            <h1>Авторизация</h1>

            <form id="loginForm" method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="container mt-5">
                    <div class="form-group">
                        <div class="form-check form-switch" style="text-align: left;">
                            <input class="form-check-input form-control-md" type="checkbox" role="switch"
                                id="CompanyLoginCheckbox" name="CompanySwitch">
                            <label class="form-check-label" for="CompanyLoginCheckbox">Корпоративный аккаунт</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="" required>
                    <label for="companyName">Логин или email</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="" required>
                    <label for="companyName">Пароль</label>
                </div>

                <button type="button"
                        class="btn btn-primary mt-3 w-75"
                        style="background-color: #00c4a0; color: white; padding: 12px; font-size: 1.1rem; width: 100%; border: none"
                        id="loginButton">
                    Войти
                </button>

                <div class="mt-3">
                    <a href="/register">Зарегистрироваться</a> |
                    <a href="/reset">Восстановить пароль</a>
                </div>
            </form>
            {% if messages %}
            <div class="alert-container">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div> 
    </div>
    {% include "../main/footer.html" %}

    <script src="{% static 'js/login/button_listener.js' %}"></script>
</body>
</html>
