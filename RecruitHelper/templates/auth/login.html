{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CareerAI</title>
    <link rel="stylesheet" href="{% static 'css/design.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <style>
        .auth-page {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--white);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--shadow-hover);
            max-width: 450px;
            width: 100%;
        }
        .auth-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }
        .auth-card p {
            text-align: center;
            color: var(--light-text);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-text);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary-blue);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .checkbox-group input {
            width: auto;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--light-text);
        }
        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% include "../main/menu.html" %}
    
    <main>
        <div class="auth-page">
            <div class="auth-card">
                <h1>Вход в систему</h1>
                <p>Войдите, чтобы продолжить работу</p>
                
                {% if messages %}
                <div class="error-message" role="alert" aria-live="polite">
                    {% for message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="email" id="username" name="username" required placeholder="example@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div style="position: relative;">
                            <input type="password" id="password" name="password" required placeholder="Введите пароль" style="padding-right: 45px;">
                            <button type="button" onclick="togglePassword('password', this)" class="password-toggle-btn" aria-label="Показать пароль" aria-pressed="false" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; width: 24px; height: 24px;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path class="eye-open" d="M12 5C7 5 2.73 8.11 1 12.5C2.73 16.89 7 20 12 20C17 20 21.27 16.89 23 12.5C21.27 8.11 17 5 12 5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="#666"/>
                                    <path class="eye-closed" d="M12 7C14.76 7 17 9.24 17 12C17 12.65 16.87 13.26 16.64 13.83L19.56 16.75C21.07 15.49 22.26 13.86 22.99 12C21.26 7.61 16.99 4.5 11.99 4.5C10.59 4.5 9.25 4.75 8.01 5.2L10.17 7.36C10.74 7.13 11.35 7 12 7ZM2 4.27L4.28 6.55L4.74 7.01C3.08 8.3 1.78 10.02 1 12C2.73 16.39 7 19.5 12 19.5C13.55 19.5 15.03 19.2 16.38 18.66L16.8 19.08L19.73 22L21 20.73L3.27 3L2 4.27ZM7.53 9.8L9.08 11.35C9.03 11.56 9 11.78 9 12C9 13.66 10.34 15 12 15C12.22 15 12.44 14.97 12.65 14.92L14.2 16.47C13.53 16.8 12.79 17 12 17C9.24 17 7 14.76 7 12C7 11.21 7.2 10.47 7.53 9.8ZM11.84 9.02L14.99 12.17L15.01 11.99C15.01 10.33 13.67 8.99 12.01 8.99L11.84 9.02Z" fill="#666" style="display: none;"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="checkbox-group">
                        <input type="checkbox" id="CompanyLoginCheckbox" name="CompanyLoginCheckbox">
                        <label for="CompanyLoginCheckbox" style="margin: 0; font-weight: 400;">Я представитель компании</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Войти</button>
                </form>
                
                <div class="auth-footer">
                    Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
                </div>
            </div>
        </div>
    </main>
    
    {% include "../main/footer.html" %}
    
    <style>
        .password-toggle-btn:hover svg path {
            fill: #0091ea;
        }
    </style>
    
    <script>
        function togglePassword(fieldId, btn) {
            const field = document.getElementById(fieldId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            
            if (field.type === 'password') {
                field.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
                btn.setAttribute('aria-label', 'Скрыть пароль');
                btn.setAttribute('aria-pressed', 'true');
            } else {
                field.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
                btn.setAttribute('aria-label', 'Показать пароль');
                btn.setAttribute('aria-pressed', 'false');
            }
        }
    </script>
</body>
</html>
